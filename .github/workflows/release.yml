name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime ZIP
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=sketch-kites/ -o "sketch-kites-${VERSION}.zip" HEAD

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" \
              "sketch-kites-${VERSION}.zip#Sketch Kites (${VERSION} Runtime ZIP)" \
              "colouring-templates/sketch-kites-2up-template.pdf#Printable Kite Templates (PDF)" \
              --clobber
          else
            gh release create "${VERSION}" \
              "sketch-kites-${VERSION}.zip#Sketch Kites (${VERSION} Runtime ZIP)" \
              "colouring-templates/sketch-kites-2up-template.pdf#Printable Kite Templates (PDF)" \
              --title "Sketch Kites ${VERSION}" \
              --generate-notes
          fi
